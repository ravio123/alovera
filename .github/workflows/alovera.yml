name: Alovera Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Alovera APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF2
          storeFile=my-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF2

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Prepare APK and AAB
        run: |
          mkdir -p output

          debug_apk=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          release_apk=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          release_aab=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)

          echo "Debug APK: $debug_apk"
          echo "Release APK: $release_apk"
          echo "Release AAB: $release_aab"

          test -n "$debug_apk"
          test -n "$release_apk"
          test -n "$release_aab"

          cp "$debug_apk" output/Alovera-debug.apk
          cp "$release_apk" output/Alovera-release.apk
          cp "$release_aab" output/Alovera-release.aab

          echo "=== Generated files ==="
          ls -lh output

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alovera-Android
          path: output/

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/app/my-release-key.jks
          rm -f android/key.properties
